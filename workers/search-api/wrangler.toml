name = "putixuezi-search"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# 绑定自定义域名时取消注释（域名须在同一 Cloudflare 账号下），并把 docs/search.md 中的 data-api 改为该域名
# routes = [{ pattern = "searchapi.example.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "putixuezi-search"
# 首次执行 npx wrangler d1 create putixuezi-search 后，把输出的 database_id 填在这里
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# 多个关键词须在同一篇文章中都出现；展示时优先显示在多少字以内同时出现的位置（规范化后的字数）
NEAR_CHARS = "80"
# 每篇文章最多返回的段落数
MAX_PARAS = "20"
# 段落超过多少字时截取以关键词为中心的片段
SNIPPET_CHARS = "160"
# 每篇文章最多取回几个命中块用于展示（每块约 90KB，限制数据量与 Worker CPU）
MAX_BLOCKS_PER_DOC = "2"
PAGE_SIZE = "10"
# 边缘结果缓存（缓存键含数据版本，重新导入后自动失效）与浏览器缓存时长（秒）
CACHE_TTL = "86400"
CLIENT_CACHE_TTL = "600"
