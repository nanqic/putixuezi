name = "putixuezi-search"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# 自定义域名（docs/search.md 的 data-api 用它）；workers.dev 地址仍保留可用
routes = [{ pattern = "happy-lamport.ningway.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "putixuezi-search"
# 亚太区（--location=apac），国内访问延迟较低
database_id = "05e4373a-b3c0-480e-9007-66d2b338f955"

[vars]
# 多个关键词须在同一篇文章中都出现；展示时优先显示在多少字以内同时出现的位置（规范化后的字数）
NEAR_CHARS = "80"
# 每篇文章最多返回的段落数
MAX_PARAS = "20"
# 段落超过多少字时截取以关键词为中心的片段
SNIPPET_CHARS = "160"
# 每篇文章最多取回几个命中块用于展示（每块约 90KB，限制数据量与 Worker CPU）
MAX_BLOCKS_PER_DOC = "2"
PAGE_SIZE = "10"
# 边缘结果缓存（缓存键含数据版本，重新导入后自动失效）与浏览器缓存时长（秒）
CACHE_TTL = "86400"
CLIENT_CACHE_TTL = "600"
